name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build website
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Install Deno
        shell: bash
        run: |
          set -euo pipefail
          DENO_VERSION=2.9.8
          mkdir -p "$RUNNER_TEMP/deno"
          curl --fail --location --retry 6 --retry-all-errors --retry-delay 4 --connect-timeout 20 \
            "https://dl.deno.land/release/v${DENO_VERSION}/deno-x86_64-unknown-linux-gnu.zip" \
            --output "$RUNNER_TEMP/deno/deno.zip"
          unzip -oq "$RUNNER_TEMP/deno/deno.zip" -d "$RUNNER_TEMP/deno"
          chmod +x "$RUNNER_TEMP/deno/deno"
          echo "$RUNNER_TEMP/deno" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/deno/deno" --version
      - name: Type-check game Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/game/index.ts
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
